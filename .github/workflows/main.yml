
name: Kittygram workflow

on:
  push:
    branches:
      - main

jobs:

  # ============================================================
  # 1. ТЕСТИРОВАНИЕ BACKEND
  # ============================================================

  backend_tests:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:13

        env:
          POSTGRES_DB: kittygram
          POSTGRES_USER: kittygram_user
          POSTGRES_PASSWORD: kittygram_password

        ports:
          - 5432:5432

        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8==7.3.0
          pip install -r backend/requirements.txt

      - name: Check backend with flake8
        run: |
          python -m flake8 backend/

      - name: Run backend tests
        env:
          POSTGRES_DB: kittygram
          POSTGRES_USER: kittygram_user
          POSTGRES_PASSWORD: kittygram_password
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DEBUG: "True"
          ALLOWED_HOSTS: localhost,127.0.0.1
        run: |
          cd backend/
          python manage.py test


  # ============================================================
  # 2. ТЕСТИРОВАНИЕ FRONTEND
  # ============================================================

  frontend_tests:
    name: Frontend tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 18

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: ./frontend
        run: npm test -- --watchAll=false


  # ============================================================
  # 3. СБОРКА И ОТПРАВКА BACKEND В DOCKER HUB
  # ============================================================

  build_backend:
    name: Build and push backend
    runs-on: ubuntu-latest

    needs:
      - backend_tests
      - frontend_tests

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/kittygram_backend:latest


  # ============================================================
  # 4. СБОРКА И ОТПРАВКА FRONTEND В DOCKER HUB
  # ============================================================

  build_frontend:
    name: Build and push frontend
    runs-on: ubuntu-latest

    needs:
      - backend_tests
      - frontend_tests

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/kittygram_frontend:latest


  # ============================================================
  # 5. СБОРКА И ОТПРАВКА GATEWAY В DOCKER HUB
  # ============================================================

  build_gateway:
    name: Build and push gateway
    runs-on: ubuntu-latest

    needs:
      - backend_tests
      - frontend_tests

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push gateway image
        uses: docker/build-push-action@v7
        with:
          context: ./nginx
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/kittygram_gateway:latest


  # ============================================================
  # 6. АВТОМАТИЧЕСКИЙ ДЕПЛОЙ НА СЕРВЕР
  # ============================================================

  deploy:
    name: Deploy Kittygram
    runs-on: ubuntu-latest

    needs:
      - build_backend
      - build_frontend
      - build_gateway

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Copy docker-compose.production.yml to server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "docker-compose.production.yml"
          target: "kittygram"

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}

          script: |
            cd kittygram

            sudo docker compose -f docker-compose.production.yml pull

            sudo docker compose -f docker-compose.production.yml down

            sudo docker compose -f docker-compose.production.yml up -d

            sleep 15

            sudo docker compose -f docker-compose.production.yml exec backend python manage.py migrate

            sudo docker compose -f docker-compose.production.yml exec backend python manage.py collectstatic --noinput

            sudo docker compose -f docker-compose.production.yml exec backend mkdir -p /backend_static/static

            sudo docker compose -f docker-compose.production.yml exec backend cp -r /app/collected_static/. /backend_static/static/

            sudo docker image prune -f


  # ============================================================
  # 7. TELEGRAM-УВЕДОМЛЕНИЕ
  # ============================================================

  send_message:
    name: Send Telegram notification
    runs-on: ubuntu-latest

    needs:
      - deploy

    steps:
      - name: Send Telegram message
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            Деплой Kittygram успешно выполнен!
            Репозиторий: ${{ github.repository }}
            Коммит: ${{ github.sha }}
